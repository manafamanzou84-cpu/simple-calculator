<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Arcade</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050b14;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
      }

      body {
        position: relative;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(#7fc8ff 0%, #dbeeff 38%, #559a3a 38%, #3a6d2d 100%);
      }

      .hud {
        position: fixed;
        top: 18px;
        left: 18px;
        background: rgba(10, 18, 30, 0.54);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        backdrop-filter: blur(5px);
        z-index: 20;
      }

      #speed {
        font-size: clamp(24px, 2vw, 36px);
        font-weight: 700;
        letter-spacing: 1px;
      }

      #cameraLabel {
        margin-top: 6px;
        color: #bfe8ff;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      #message {
        margin-top: 8px;
        font-size: 12px;
        color: rgba(255,255,255,0.8);
        line-height: 1.4;
      }

      .camera-buttons {
        position: fixed;
        right: 18px;
        bottom: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
        z-index: 20;
      }

      .camera-buttons button {
        background: rgba(15, 23, 42, 0.78);
        color: white;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease;
      }

      .camera-buttons button:hover {
        background: rgba(28, 43, 62, 0.95);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div id="speed">0 km/h</div>
      <div id="cameraLabel">Camera: chasse</div>
      <div id="message">Flèches : accélérer / freiner / tourner <br> C : changer de caméra</div>
    </div>

    <div class="camera-buttons">
      <button data-camera="chase">Chasse</button>
      <button data-camera="hood">Capot</button>
      <button data-camera="cockpit">Cockpit</button>
      <button data-camera="top">Vue haute</button>
    </div>

    <canvas id="game"></canvas>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const speedLabel = document.getElementById('speed');
      const cameraLabel = document.getElementById('cameraLabel');

      let width = 0;
      let height = 0;
      const resize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * Math.min(window.devicePixelRatio || 1, 2);
        canvas.height = height * Math.min(window.devicePixelRatio || 1, 2);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(Math.min(window.devicePixelRatio || 1, 2), Math.min(window.devicePixelRatio || 1, 2));
      };
      window.addEventListener('resize', resize);
      resize();

      const keys = {
        up: false,
        down: false,
        left: false,
        right: false,
      };

      const state = {
        speed: 0,
        maxSpeed: 260,
        x: 0,
        steering: 0,
        camera: 'chase',
        lastTime: 0,
        roadScroll: 0,
        score: 0,
        traffic: [],
      };

      const spawnTraffic = () => {
        const lanes = [-2.2, -0.8, 0.8, 2.2];
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        const z = 600 + Math.random() * 800;
        const speed = 90 + Math.random() * 150;
        state.traffic.push({ lane, z, speed, color: `hsl(${Math.random() * 360}, 70%, 60%)`, wobble: Math.random() * 10 + 1 });
      };

      for (let i = 0; i < 10; i++) {
        spawnTraffic();
      }

      const updateCameraLabel = () => {
        const names = {
          chase: 'chasse',
          hood: 'capot',
          cockpit: 'cockpit',
          top: 'vue haute',
        };
        cameraLabel.textContent = 'Camera: ' + names[state.camera];
      };

      const cycleCamera = () => {
        const order = ['chase', 'hood', 'cockpit', 'top'];
        const idx = order.indexOf(state.camera);
        state.camera = order[(idx + 1) % order.length];
        updateCameraLabel();
      };

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'arrowup' || key === 'w') keys.up = true;
        if (key === 'arrowdown' || key === 's') keys.down = true;
        if (key === 'arrowleft' || key === 'a') keys.left = true;
        if (key === 'arrowright' || key === 'd') keys.right = true;
        if (key === 'c') cycleCamera();
      });

      document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'arrowup' || key === 'w') keys.up = false;
        if (key === 'arrowdown' || key === 's') keys.down = false;
        if (key === 'arrowleft' || key === 'a') keys.left = false;
        if (key === 'arrowright' || key === 'd') keys.right = false;
      });

      document.querySelectorAll('[data-camera]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.camera = btn.dataset.camera;
          updateCameraLabel();
        });
      });

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

      const drawRoad = (scroll) => {
        const cx = width / 2;
        const horizon = height * 0.18;
        const floorY = height * 0.98;
        const roadWStart = width * 0.08;
        const roadWEnd = width * 0.86;

        ctx.fillStyle = '#4e9e42';
        ctx.fillRect(0, horizon, width, height - horizon);

        const segments = 26;
        for (let i = 0; i < segments; i++) {
          const t1 = i / segments;
          const t2 = (i + 1) / segments;
          const y1 = horizon + (floorY - horizon) * t1;
          const y2 = horizon + (floorY - horizon) * t2;
          const w1 = roadWStart + (roadWEnd - roadWStart) * t1;
          const w2 = roadWStart + (roadWEnd - roadWStart) * t2;

          ctx.fillStyle = i % 2 === 0 ? '#2a2a2a' : '#313131';
          ctx.beginPath();
          ctx.moveTo(cx - w1 / 2, y1);
          ctx.lineTo(cx + w1 / 2, y1);
          ctx.lineTo(cx + w2 / 2, y2);
          ctx.lineTo(cx - w2 / 2, y2);
          ctx.closePath();
          ctx.fill();
        }

        // lignes de route
        for (let i = 0; i < 22; i++) {
          const t = (i / 22 + scroll * 0.0015) % 1;
          const y = horizon + (floorY - horizon) * t;
          const w = roadWStart + (roadWEnd - roadWStart) * t;
          const lineW = Math.max(2, w * 0.012);

          ctx.fillStyle = '#f5f5f5';
          ctx.fillRect(cx - lineW / 2, y - 12, lineW, 18);
          ctx.fillRect(cx + w * 0.28 - lineW / 2, y - 12, lineW, 18);
          ctx.fillRect(cx - w * 0.28 - lineW / 2, y - 12, lineW, 18);
        }
      };

      const projectWorld = (lane, z) => {
        const cx = width / 2;
        const horizon = height * 0.18;
        const floorY = height * 0.98;
        const roadWStart = width * 0.08;
        const roadWEnd = width * 0.86;

        const t = clamp(1 - z / 1000, 0, 1);
        const y = horizon + (floorY - horizon) * t;
        const roadHalf = roadWStart + (roadWEnd - roadWStart) * t;
        const x = cx + lane * roadHalf * 0.42;
        const scale = 0.18 + t * 1.2;
        return { x, y, scale };
      };

      const drawEnemy = (enemy) => {
        const { x, y, scale } = projectWorld(enemy.lane, enemy.z);
        if (y < height * 0.12 || y > height * 0.96) return;

        const w = 52 * scale;
        const h = 96 * scale;
        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = enemy.color;
        ctx.fillRect(-w / 2, -h / 2, w, h);

        ctx.fillStyle = '#dfeafc';
        ctx.fillRect(-w * 0.35, -h * 0.45, w * 0.7, h * 0.32);

        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-w * 0.38, -h * 0.2, w * 0.2, h * 0.12);
        ctx.fillRect(w * 0.18, -h * 0.2, w * 0.2, h * 0.12);
        ctx.fillRect(-w * 0.38, h * 0.12, w * 0.2, h * 0.12);
        ctx.fillRect(w * 0.18, h * 0.12, w * 0.2, h * 0.12);

        ctx.restore();
      };

      const drawPlayerCar = () => {
        const cx = width / 2;
        const cy = height * 0.76;

        if (state.camera === 'top') {
          ctx.save();
          ctx.translate(cx + state.x * 135, height * 0.68);
          ctx.fillStyle = '#1f9bff';
          ctx.fillRect(-36, -22, 72, 44);
          ctx.fillStyle = '#dfeafc';
          ctx.fillRect(-18, -10, 36, 14);
          ctx.fillStyle = '#101010';
          ctx.fillRect(-26, -18, 14, 10);
          ctx.fillRect(12, -18, 14, 10);
          ctx.fillRect(-26, 10, 14, 10);
          ctx.fillRect(12, 10, 14, 10);
          ctx.restore();
          return;
        }

        if (state.camera === 'cockpit') {
          const windshieldHeight = height * 0.44;
          const hoodY = height * 0.5;
          ctx.fillStyle = '#0b1119';
          ctx.fillRect(0, height * 0.16, width, height * 0.84);

          // tableau de bord
          ctx.fillStyle = '#1f2937';
          ctx.fillRect(width * 0.18, height * 0.62, width * 0.64, height * 0.18);
          ctx.fillStyle = '#7dd3fc';
          ctx.fillRect(width * 0.22, height * 0.66, width * 0.56, height * 0.08);
          ctx.fillRect(width * 0.22, height * 0.77, width * 0.56, height * 0.02);

          // pare-brise
          ctx.beginPath();
          ctx.moveTo(width * 0.33, height * 0.24);
          ctx.lineTo(width * 0.67, height * 0.24);
          ctx.lineTo(width * 0.82, height * 0.56);
          ctx.lineTo(width * 0.18, height * 0.56);
          ctx.closePath();
          ctx.fillStyle = 'rgba(220,240,255,0.22)';
          ctx.fill();

          // route visible devant
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 2;
          for (let i = 0; i < 9; i++) {
            const y = hoodY + i * 35;
            ctx.beginPath();
            ctx.moveTo(width * 0.5 - 90, y);
            ctx.lineTo(width * 0.5 + 90, y);
            ctx.stroke();
          }
          return;
        }

        const scale = state.camera === 'chase' ? 1 : 1.24;
        const carX = cx + state.x * 110;
        const carY = cy + (state.camera === 'hood' ? -20 : 10);

        ctx.save();
        ctx.translate(carX, carY);
        ctx.scale(scale, scale);

        ctx.fillStyle = '#1b9bfd';
        ctx.fillRect(-52, -18, 104, 36);
        ctx.fillStyle = '#dfeafc';
        ctx.fillRect(-22, -10, 44, 18);

        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(-44, -26, 16, 12);
        ctx.fillRect(28, -26, 16, 12);
        ctx.fillRect(-44, 14, 16, 12);
        ctx.fillRect(28, 14, 16, 12);

        ctx.fillStyle = '#fffdc8';
        ctx.fillRect(-20, -24, 12, 8);
        ctx.fillRect(8, -24, 12, 8);
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(-20, 17, 12, 7);
        ctx.fillRect(8, 17, 12, 7);

        ctx.restore();
      };

      const updateTraffic = (dt) => {
        for (let i = state.traffic.length - 1; i >= 0; i--) {
          const car = state.traffic[i];
          car.z -= (state.speed * 0.8 + car.speed * 0.5) * dt;

          if (car.z < -70) {
            state.traffic.splice(i, 1);
            spawnTraffic();
          }

          if (car.z > 10 && car.z < 120 && Math.abs(car.lane - state.x) < 1.2) {
            state.speed *= 0.75;
            car.z = -180;
          }
        }
      };

      const update = (dt) => {
        const acceleration = keys.up ? 180 : 0;
        const brake = keys.down ? 240 : 0;
        const steerDir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);

        if (keys.up) {
          state.speed += acceleration * dt;
        } else {
          state.speed -= 60 * dt;
        }

        if (keys.down) {
          state.speed -= brake * dt;
        }

        state.speed = clamp(state.speed, 0, state.maxSpeed);
        state.steering += (steerDir - state.steering) * dt * 7;
        state.x += state.steering * dt * (18 + state.speed * 0.12);
        state.x = clamp(state.x, -3.2, 3.2);

        state.roadScroll += state.speed * dt * 0.7;
        updateTraffic(dt);

        speedLabel.textContent = `${Math.round(state.speed * 0.95)} km/h`;
      };

      const render = () => {
        ctx.clearRect(0, 0, width, height);

        drawRoad(state.roadScroll);

        for (const car of state.traffic) {
          drawEnemy(car);
        }

        drawPlayerCar();

        // petits panneaux/ombrages
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, height * 0.64, width, height * 0.36);
      };

      const loop = (timestamp) => {
        const dt = Math.min(0.03, (timestamp - (state.lastTime || timestamp)) / 1000);
        state.lastTime = timestamp;
        update(dt);
        render();
        requestAnimationFrame(loop);
      };

      updateCameraLabel();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
